name: Diagnostico aislado lectura Olé (sin publicar)
on:
  push:
    branches:
      - codex/diag-ole-cobertura-20261013
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Revisar bloques de la fuente web sin guardarlos
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import urllib.request
          from bs4 import BeautifulSoup
          from zoneinfo import ZoneInfo
          from scripts.actualizar_agenda import parse_html, _candidate, TIME_RE, _day, nrm
          url='https://www.ole.com.ar/agenda-deportiva'
          req=urllib.request.Request(url, headers={'User-Agent':'TVFULL-Eventos-Agenda/1.0 (+https://github.com/luchochavezfacebook-byte/TVFULL-EVENTOS)','Accept':'text/html,application/xhtml+xml'})
          with urllib.request.urlopen(req,timeout=20) as resp:
              html=resp.read(2_000_001).decode('utf-8','replace')
          now=dt.datetime.now(ZoneInfo('America/Argentina/Buenos_Aires'))
          soup=BeautifulSoup(html,'html.parser')
          for item in soup.select('script,style,nav,footer,header,noscript,iframe'):
              item.decompose()
          tokens=[t.strip() for t in soup.get_text('\n',strip=True).splitlines() if t.strip()]
          parsed=parse_html(html,now)
          print('AHORA:',now.isoformat())
          print('FUENTE: tokens=',len(tokens),' partidos=',len(parsed))
          agenda_links=sorted(set(a.get('href','') for a in BeautifulSoup(html,'html.parser').select('a[href]') if 'partidos-hoy-' in a.get('href','') or 'agenda-deportiva/' in a.get('href','')))
          print('ENLACES AGENDA:',len(agenda_links))
          for href in agenda_links[:20]: print('  LINK:',href[:180])
          for name in ['Boca Juniors','Sabah','Slavia Praga','Lens','Arsenal','Inter','Atlético de Madrid','Villarreal','Sarmiento']:
              hits=[i for i,v in enumerate(tokens) if nrm(v)==nrm(name)]
              print('EQUIPO:',name,'apariciones',len(hits))
              for i in hits[:2]:
                  before=tokens[max(0,i-3):i+1]
                  after=tokens[i+1:i+8]
                  print('  ANT:',before)
                  print('  POS:',after)
                  match_time=next((j for j in range(i+1,min(i+7,len(tokens))) if TIME_RE.fullmatch(tokens[j])),None)
                  if match_time is not None:
                      print('  CANDIDATO:',_candidate(tokens,match_time,now.date(),now))
          print('EVENTOS HOY:',[(x['title'],x['starts_at'],x['channel_names']) for x in parsed if x['starts_at'][:10]==now.date().isoformat()])
          PY
